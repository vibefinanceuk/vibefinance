<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>

<!--
  Structural tokens first, then the customer's livery over the top.

  Both are stylesheets rather than JavaScript so they apply before the
  first paint. Fetching branding as JSON and setting variables in script
  would mean a visible flash of the wrong colours (decision 0096).
-->
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" id="brand" href="">
<script src="/config.js"></script>

<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--surface-0);
    font: 14px/1.5 var(--font-sans, system-ui, -apple-system, sans-serif);
    color: var(--text-primary);
  }

  main {
    width: min(400px, calc(100vw - 32px));
    background: var(--surface-2);
    border: 0.5px solid var(--border);
    border-radius: var(--radius, 8px);
    padding: 28px;
  }

  .mark {
    height: 4px;
    background: var(--brand-bar);
    border-radius: 2px;
    margin-bottom: 20px;
  }

  h1 {
    font-size: 18px;
    font-weight: 600;
    margin: 0 0 4px;
  }

  .sub {
    color: var(--text-secondary);
    margin: 0 0 20px;
  }

  label {
    display: block;
    font-size: 12px;
    color: var(--text-secondary);
    margin: 14px 0 4px;
  }

  input, select {
    width: 100%;
  }

  button[type="submit"] {
    width: 100%;
    margin-top: 20px;
    min-height: 36px;
    background: var(--brand-fill);
    color: #fff;
    border: none;
    font-weight: 500;
  }

  button[type="submit"]:disabled {
    opacity: 0.55;
    cursor: default;
  }

  .problem {
    margin-top: 16px;
    padding: 10px 12px;
    background: var(--bg-warning);
    color: var(--text-warning);
    border: 0.5px solid var(--border-warning);
    border-radius: var(--radius, 8px);
    font-size: 13px;
  }

  .problem:empty { display: none; }

  /*
    What ISO 27001:2022 Annex A 8.5 asks be shown after signing in: the
    last sign-in, and every attempt since. The point is that somebody
    who does not recognise an attempt learns something an audit log read
    by nobody never tells them (decision 0090).
  */
  .since {
    margin-top: 16px;
    font-size: 13px;
    color: var(--text-secondary);
  }

  .since ul { margin: 6px 0 0; padding-left: 18px; }
  .since li { color: var(--text-warning); }
</style>
</head>

<body>
<main>
  <div class="mark"></div>
  <h1 id="product">VibeFinance</h1>
  <p class="sub">Sign in to continue</p>

  <form id="signin" autocomplete="on">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required autocomplete="username">

    <label for="password">Password</label>
    <input id="password" name="password" type="password" required autocomplete="current-password">

    <label for="environment">Environment</label>
    <select id="environment" name="environment" required>
      <option value="">Choose after signing in…</option>
    </select>

    <button type="submit" id="submit">Continue</button>
  </form>

  <div class="problem" id="problem" role="alert"></div>
  <div class="since" id="since"></div>
</main>

<script type="module" src="/signin.js"></script>
</body>
</html>
