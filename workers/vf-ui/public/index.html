<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>

<!--
  Structural tokens first, then the customer's livery over the top.

  Both are stylesheets rather than JavaScript so they apply before the
  first paint. Fetching branding as JSON and setting variables in script
  would mean a visible flash of the wrong colours (decision 0096).
-->
<link rel="stylesheet" href="/tokens.css">
<script>
  /*
    The mood, before the first paint — decision 0139.

    Inline and synchronous on purpose: a module loaded normally runs
    after the stylesheet has already painted, so somebody who chose
    Night time would see a white screen flash first. That is the failure
    decision 0103 records as the one a person notices and nobody tests.
  */
  try {
    var mood = localStorage.getItem("vf-mood");
    if (!mood) {
      mood = window.matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "day";
    }
    document.documentElement.setAttribute("data-mood", mood);
  } catch (e) {
    /* A browser refusing storage still gets the media query's answer. */
  }
</script>
<link rel="stylesheet" id="brand" href="">
<script src="/config.js"></script>

<style>
  /*
    Restraint in service of legibility, not impression — decision 0101.
    This is a tool somebody uses all day, so the quiet has to make the
    work easier to read rather than make the page look expensive.

    Three things carry it, and no new assets:

      1. Vertical rhythm that GROUPS. A label sits close to its field
         and far from the next one, so the eye reads three pairs rather
         than one list of six things.
      2. One element leading. The heading is larger and the rest steps
         down from it, where before everything had equal weight.
      3. No card. A frame makes the form an object floating on a
         surface; letting it sit in space is more confident, and only
         works once the composition holds it together.
  */

  :root {
    /* An explicit scale, because tokens.css has none. Each step is a
       ratio rather than an arbitrary number, so the relationships hold
       if any one changes. */
    --step-0: 14px;
    --step-1: 15px;
    --step-2: 26px;

    /* Rhythm. The tight value binds a label to its field; the loose
       one separates one pair from the next. Their RATIO is what does
       the grouping — roughly one to four. */
    --gap-tight: 7px;
    --gap-loose: 26px;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    /* A single wash of the brand behind the page. Not a background
       image: an external image would make a customer's login page
       depend on a third party, which is an availability question on
       the authentication path and a data-protection one in a finance
       product. This is one gradient and no requests. */
    background:
      radial-gradient(120% 90% at 50% -10%, color-mix(in oklab, var(--brand-fill) 11%, transparent), transparent 65%),
      var(--surface-0);
    font: var(--step-0)/1.5 var(--font-sans);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }

  main {
    width: min(360px, calc(100vw - 40px));
    /* No card, no border, no panel. */
    padding: 0 0 40px;
  }

  /*
    The brand mark: a short rule rather than a full-width bar. A bar
    spanning the form reads as a container's edge; a mark reads as
    identity, and stays out of the way of the work.
  */
  .mark {
    width: 34px;
    height: 3px;
    background: var(--brand-fill);
    border-radius: 2px;
    margin-bottom: 22px;
  }

  h1 {
    font-size: var(--step-2);
    font-weight: 600;
    letter-spacing: -0.021em; /* Large text sets loose; pulled back in. */
    margin: 0 0 6px;
  }

  .sub {
    color: var(--text-secondary);
    margin: 0 0 34px;
  }

  /* The grouping, stated once rather than per field. */
  .field + .field { margin-top: var(--gap-loose); }

  label {
    display: block;
    font-size: var(--text-sm);
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: var(--gap-tight);
  }

  input, select {
    width: 100%;
    font-size: var(--step-1);
    min-height: 38px;
    background: var(--surface-1);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 11px;
    color: var(--text-primary);
    /* Only the border moves on focus. A shifting shadow or size makes
       a form feel unsteady under the hands. */
    transition: border-color 120ms ease;
  }

  input:focus, select:focus {
    outline: none;
    border-color: var(--brand-fill);
  }

  select:disabled { color: var(--text-muted); }

  button[type="submit"] {
    width: 100%;
    margin-top: 34px;
    min-height: 40px;
    font-size: var(--step-1);
    font-weight: 500;
    background: var(--brand-fill);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    transition: opacity 120ms ease;
  }

  button[type="submit"]:hover:not(:disabled) { opacity: 0.9; }
  button[type="submit"]:disabled { opacity: 0.4; cursor: default; }

  /*
    Messages sit below the form and are quiet by default. A red panel
    for a mistyped password treats an ordinary event as an emergency;
    the text carries it.
  */
  .problem, .since {
    margin-top: 22px;
    font-size: var(--text-base);
    line-height: 1.55;
  }

  .problem {
    color: var(--text-warning);
  }

  .problem:empty, .since:empty { display: none; }

  .since { color: var(--text-secondary); }

  /*
    The Task Manager, inside a persistent frame — decision 0108.

    A denser layout than the sign-in card on purpose: this is a screen
    somebody reads all day, so restraint has to serve legibility rather
    than air (0101).
  */
  body.working {
    display: block;
    place-items: initial;
    background: var(--surface-0);
  }

  .frame {
    display: grid;
    /* Navigation, then everything else. The nav is narrow and fixed:
       it is a place to return from, not a thing to read. */
    grid-template-columns: 200px minmax(0, 1fr);
    min-height: 100vh;
  }

  .nav {
    border-right: 0.5px solid var(--border);
    padding: 20px 12px;
    background: var(--surface-1);
  }



  /*
    The mark at the foot of the column — decision 0145.

    The nav is a flex column so `.who` can be pushed down; the logo
    sits below it, centred, and quiet.
  */
  .nav { display: flex; flex-direction: column; }
  .nav .who { margin-top: auto; }

  /*
    Two marks, swapped by the mood — decision 0145.

    **The navy wordmark all but vanishes** on the night surface:
    `#001842` against `#0d1626` is a difference of value nobody can
    read, and the mark becomes an outline. A light variant carries the
    wordmark at the same weight as the text beside it, and the `V`
    keeps its gradient in both because the gradient carries itself.

    Swapped in CSS rather than in script, so it follows the mood without
    a second thing to remember (decision 0139) and needs no repaint.
  */
  .brandmark.light { display: none; }

  @media (prefers-color-scheme: dark) {
    :root:not([data-mood="day"]) .brandmark.dark { display: none; }
    :root:not([data-mood="day"]) .brandmark.light { display: block; }
  }

  :root[data-mood="night"] .brandmark.dark { display: none; }
  :root[data-mood="night"] .brandmark.light { display: block; }

  :root[data-mood="day"] .brandmark.dark { display: block; }
  :root[data-mood="day"] .brandmark.light { display: none; }

  .brandmark {
    display: block;
    width: 100%;
    /* 60% of where it started, at the operator's asking: at the head
       of a column it orients rather than announces. */
    max-width: 84px;
    height: auto;
    margin: 2px auto 20px;
    /*
      **Quieter than the interface it sits in.** A brand mark on a tool
      somebody uses all day should be present rather than insistent, and
      the navy reads heavy against the daytime blue of decision 0139.
    */
    opacity: 0.85;
  }

  .nav a {
    display: block;
    padding: 8px 10px;
    border-radius: var(--radius);
    color: var(--text-secondary);
    text-decoration: none;
    font-size: var(--text-base);
    cursor: pointer;
  }

  .nav a:hover { background: var(--surface-2); }
  .nav a.on { background: var(--surface-2); color: var(--text-primary); }

  /* The create form — decision 0128. Inline, because three fields and
     a button is a row rather than a stack. */
  .newsource {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 14px;
  }

  /*
    Beside the list rather than below it — decision 0130. Three short
    fields in a narrow column stack; the same fields across a full width
    would leave most of it empty.
  */
  .newsource.stacked { flex-direction: column; align-items: stretch; }
  .newsource.stacked .kf { min-width: 0; }

  /* The document a row names, clickable — decision 0142. A link
     rather than a button, because it navigates rather than decides. */
  button.subjectlink {
    padding: 0;
    min-height: 0;
    border: none;
    background: none;
    color: var(--text-accent);
    font: inherit;
    font-size: var(--text-base);
    text-align: left;
    cursor: pointer;
  }

  button.subjectlink:hover { text-decoration: underline; }

  /*
    The process, as a sequence — decision 0149.

    **Chevrons rather than tabs**, because this is an order and the
    shape should say so. A tab row says "pick one of these"; a sequence
    says "the document passes through these, in this order".
  */
  .process { display: flex; overflow-x: auto; padding: 2px 0; }

  .stage {
    flex: 1 0 auto;
    min-width: 104px;
    padding: 9px 12px 9px 22px;
    background: var(--surface-1);
    border: 0.5px solid var(--border);
    border-left: none;
    border-radius: 0;
    color: var(--text-muted);
    font-size: var(--text-sm);
    text-align: left;
    white-space: nowrap;
    position: relative;
    min-height: 0;
  }

  .stage:first-child { border-left: 0.5px solid var(--border); border-radius: var(--radius) 0 0 var(--radius); padding-left: 14px; }
  .stage:last-child { border-radius: 0 var(--radius) var(--radius) 0; }

  .stage::after {
    content: "";
    position: absolute;
    right: -9px; top: 50%;
    width: 16px; height: 16px;
    margin-top: -8px;
    background: var(--surface-1);
    border-top: 0.5px solid var(--border);
    border-right: 0.5px solid var(--border);
    transform: rotate(45deg);
    z-index: 1;
  }
  .stage:last-child::after { display: none; }

  /* Where the rules being shown actually run. The one bold thing. */
  .stage.here { background: var(--text-accent); border-color: var(--text-accent); color: #fff; font-weight: 600; }
  .stage.here::after { background: var(--text-accent); border-color: var(--text-accent); }

  .stage .count { display: block; font-size: var(--text-sm); opacity: 0.85; font-weight: 400; }

  /*
    A stage the document has not reached — decision 0151.

    Dimmed rather than hidden, so the sequence still reads as a whole
    and somebody can see what is still to come.
  */
  .stage.ahead { opacity: 0.55; }

  /*
    Writing a rule — decision 0153.

    The read-back is the one bold thing: somebody has to check the
    system understood their sentence, and everything else on the screen
    is subordinate to that.
  */
  .readback {
    background: var(--bg-accent);
    border-left: 3px solid var(--border-accent);
    border-radius: 0 var(--radius) var(--radius) 0;
    padding: 12px 16px;
    margin-bottom: 12px;
  }

  .readback .clause { display: block; margin: 2px 0; }
  .readback .clause.heading { margin-bottom: 6px; }
  .readback .clause.then { margin-top: 10px; }
  .readback .nested { padding-left: 18px; border-left: 1px solid var(--border); margin: 4px 0; }

  /* The Business Term, available and not insisted upon. */
  .readback .term { color: var(--text-accent); border-bottom: 1px dotted var(--border-accent); cursor: help; }

  /* A refusal is an answer, not a failure (decision 0033). */
  /*
    A document nothing could read — decision 0161. Warning rather than
    error: nothing went wrong, and there is something for a person to
    do.
  */
  .unreadable {
    background: var(--bg-warning);
    border-left: 3px solid var(--text-warning);
    border-radius: 0 var(--radius) var(--radius) 0;
    padding: 11px 14px;
    margin-bottom: 12px;
    color: var(--text-warning);
  }

  .refusal {
    background: var(--bg-warning);
    border-left: 3px solid var(--text-warning);
    border-radius: 0 var(--radius) var(--radius) 0;
    padding: 12px 16px;
    color: var(--text-warning);
  }

  .composebar { display: flex; gap: 12px; align-items: center; margin-top: 10px; }
  .composebar svg { width: 16px; height: 16px; margin-right: 5px; vertical-align: -3px; }

  .example { display: flex; gap: 14px; align-items: flex-start; padding: 12px 0; border-bottom: 0.5px solid var(--border); }
  .example:last-child { border-bottom: none; }
  .example .verdict { flex: 0 0 96px; font-size: var(--text-sm); font-weight: 600; }
  .example .verdict.fires { color: var(--text-accent); }
  .example .verdict.quiet { color: var(--text-muted); }
  .example .body { flex: 1; }
  /*
    An example shows what the rule turns on — decision 0159. The rest
    is folded away rather than dropped: an example is evidence, and
    evidence somebody cannot inspect is an assertion.
  */
  .example .facts { font-size: var(--text-sm); color: var(--text-secondary); }
  .example .decisive { color: var(--text-primary); font-size: var(--text-base); }
  .example .morefacts { margin-top: 5px; }
  .example .morefacts summary { cursor: pointer; color: var(--text-muted); font-size: var(--text-sm); }
  .example .morefacts > div { margin-top: 5px; line-height: 1.5; }
  .example .confirmed { color: var(--text-success); font-size: var(--text-sm); font-weight: 600; }

  .gate { display: flex; align-items: center; gap: 14px; padding: 14px 18px; background: var(--surface-1); border: 0.5px solid var(--border); border-radius: var(--radius); }
  .gate .why { font-size: var(--text-sm); color: var(--text-muted); }
  .gate svg { width: 16px; height: 16px; margin-right: 5px; vertical-align: -3px; }
  /* A rule's own name, next to a way to change it — decision 0266. */
  .rulenamerow { display: flex; align-items: center; gap: 10px; margin: 4px 0 2px; }
  .rulename { margin: 0; font-size: var(--text-lg); }

  /*
    A card each — decision 0154. A list of sentences separated by a
    hairline reads as prose; somebody scanning for one rule among ten
    needs them to be objects.
  */
  .rule {
    display: flex;
    gap: 16px;
    padding: 12px 14px;
    margin-bottom: 8px;
    background: var(--surface-1);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    align-items: baseline;
  }

  .rule:last-child { margin-bottom: 0; }
  .rule .what { flex: 1; }

  /* The button sits apart from the cards rather than among them. */
  /*
    A sentence is read on one line, not across a wide screen — decision
    0156. A rule box at 1600px would put a clause at each end and
    nothing in the middle, so it stops where prose stops being readable.
  */
  #sentence { max-width: 62ch; }

  /*
    The document manager — decision 0164.

    Eleven columns is wider than a laptop, which is why a person can
    turn columns off. It scrolls rather than wrapping.
  */
  .tablewrap { overflow-x: auto; }
  .tablewrap table { width: 100%; border-collapse: collapse; }
  .tablewrap th {
    text-align: left;
    font-size: var(--text-sm);
    font-weight: 600;
    color: var(--text-muted);
    padding: 0 10px 8px;
    border-bottom: 0.5px solid var(--border);
    white-space: nowrap;
  }
  .tablewrap td { padding: 10px; border-bottom: 0.5px solid var(--border); vertical-align: top; }
  .tablewrap tbody tr:last-child td { border-bottom: none; }
  .tablewrap tbody tr:hover { background: var(--surface-1); }
  .tablewrap .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

  .searchrow { display: flex; gap: 10px; align-items: center; }
  .searchrow input[type="search"] {
    flex: 1;
    max-width: 460px;
    padding: 9px 12px;
    border: 0.5px solid var(--border-strong);
    border-radius: var(--radius);
    background: var(--surface-2);
    color: var(--text-primary);
  }

  .status.done { color: var(--text-success); font-weight: 600; font-size: var(--text-sm); }
  .status.waiting { color: var(--text-warning); font-weight: 600; font-size: var(--text-sm); }
  .status.moving, .status.outside { color: var(--text-secondary); font-size: var(--text-sm); }
  .status.unreadable { color: var(--text-warning); font-weight: 600; font-size: var(--text-sm); }

  .unread { color: var(--text-warning); }
  .hands.none { color: var(--text-success); font-size: var(--text-sm); }
  .hands.some { color: var(--text-muted); font-size: var(--text-sm); }
  .empty { padding: 28px 10px; text-align: center; }

  button.expand {
    padding: 4px 10px; min-height: 28px;
    font-size: var(--text-sm);
    border: 0.5px solid var(--border-strong);
    border-radius: var(--radius);
    background: var(--surface-2); color: var(--text-primary);
    cursor: pointer; white-space: nowrap;
  }

  /*
    Which columns to show, kept in the browser (decision 0164).

    **Named `columnpicker`, not `columns`** — decision 0177. It was
    `columns`, which the viewer and the sources screen have used for a
    **two-column layout** since decision 0108. This rule came later and
    won, so the viewer's own layout was styled as a dropdown and its
    panels collapsed against each other.
  */
  .columnpicker { position: relative; margin-left: auto; }
  .columnpicker summary { list-style: none; cursor: pointer; color: var(--text-muted); padding: 7px 9px; border: 0.5px solid var(--border-strong); border-radius: var(--radius); display: inline-flex; }
  .columnpicker summary::-webkit-details-marker { display: none; }
  .columnpicker summary:hover { color: var(--text-accent); border-color: var(--border-accent); }
  .columnlist {
    position: absolute; right: 0; top: calc(100% + 6px); z-index: 5;
    min-width: 170px; padding: 10px 12px;
    background: var(--surface-2);
    border: 0.5px solid var(--border-strong);
    border-radius: var(--radius);
    box-shadow: 0 6px 18px rgba(0, 0, 0, .12);
  }
  .columnlist label { display: block; padding: 3px 0; font-size: var(--text-sm); cursor: pointer; }

  /*
    What a person needs before they start — decision 0175. Beneath the
    reference, where the status card used to sit below the fold.
  */
  /*
    Four facts about this document, read as a list — decision 0180.

    `Stage`, `Unique Ref`, `Waiting` and `Owner` were three different
    treatments: a bold heading, a subtitle, and a row of two. They
    answer the same kind of question — **what is this and where does it
    stand** — so they read as one column, evenly spaced, in one voice.

    The heading keeps its weight; everything under it is the same size
    and colour.
  */
  .subhead { display: flex; flex-direction: column; gap: 4px; margin: 4px 0 0; }

  /*
    **One rule, because there were three** — decision 0181.
    
    `.topbar .sub` was set twice, and the later one won with
    `--text-base` while the subhead sat at `--text-sm`. Two lines meant
    to read as one list did not.
    
    Reported as *"same font, same weight, same size — they look
    different"*, which they were.
  */
  /*
    **The viewer's heading is a list of four facts, not a heading and
    three notes** — decision 0182.

    `Stage`, `Unique Ref`, `Waiting` and `Owner` answer the same kind of
    question, and the operator asked twice for them to match. Decision
    0181 matched three of them and left the `h2` bold and a size larger,
    on my own reasoning that a heading is a heading.
    
    **It was asked for plainly and I kept overriding it.** They match.
  */
  #viewer .topbar h2,
  .topbar .sub,
  .subhead > div {
    margin: 4px 0 0;
    font-size: var(--text-sm);
    font-weight: 400;
    color: var(--text-secondary);
    line-height: 1.5;
  }

  .subhead > div { margin: 0; }

  .newrule { margin-top: 16px; }

  /* The sentence is the way into a rule — decision 0155. */
  button.rulelink {
    padding: 0;
    min-height: 0;
    border: none;
    background: none;
    color: var(--text-accent);
    font: inherit;
    font-size: var(--text-base);
    text-align: left;
    cursor: pointer;
  }
  button.rulelink:hover { text-decoration: underline; }

  .versionhead { display: flex; align-items: baseline; gap: 12px; margin-bottom: 8px; }
  .versionhead h3 { margin: 0; }
  .said { color: var(--text-secondary); margin: 0 0 10px; }

  /*
    An icon beside a label, not above it — decision 0154.

    0122 stacked them for the action row, where a column of icons is
    the point. In a sentence-shaped button a 20px icon reads as
    cumbersome, which is what it was called.
  */
  .newrule button svg,
  .composebar button svg { width: 15px; height: 15px; }

  .rulestate { font-size: var(--text-sm); font-weight: 600; min-width: 96px; display: flex; align-items: center; gap: 5px; }
  .rulestate svg { width: 14px; height: 14px; }
  .rulestate.live { color: var(--text-success); }
  .rulestate.paused { color: var(--text-muted); }
  .rulestate.awaiting_confirmation { color: var(--text-warning); }
  .rulestate.draft { color: var(--text-muted); }

  .rowactions { display: flex; gap: 4px; white-space: nowrap; }
  .rowactions button { padding: 4px 8px; min-height: 26px; font-size: var(--text-sm); }

  /* A retired source is shown, not hidden: somebody looking at where
     invoices arrive should see what stopped as well as what runs. */
  tr.retired td { opacity: 0.55; }

  .newsource .kf { margin: 0; min-width: 160px; }

  /* The identifier a name becomes, shown as somebody types
     (decision 0129). */
  .slugpreview {
    font-size: var(--text-sm);
    min-height: 16px;
    margin-top: 3px;
  }

  /* An address a supplier will be given — decision 0126. */
  .addr { font-variant-numeric: tabular-nums; }
  .pending { color: var(--text-warning); font-size: var(--text-sm); }

  .nav .who {
    margin-top: auto;
    padding: 12px 10px 0;
    border-top: 0.5px solid var(--border);
    font-size: var(--text-sm);
    color: var(--text-secondary);
  }

  .main { padding: 22px 26px 60px; min-width: 0; }

  /* The document's identity, always visible. Decision 0108: opening a
     document should feel like looking at something, not like going
     somewhere and having to find the way back. */
  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding-bottom: 16px;
    margin-bottom: 18px;
    border-bottom: 0.5px solid var(--border);
  }

  /*
    **Every screen except the viewer**, where the four lines are a list
    — decision 0182. A heading is a heading elsewhere.
  */
  .topbar h2 { margin: 0; font-size: var(--text-lg); font-weight: 600; }

  .topbar .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }

  /* The mood control — decision 0139. Quieter than the actions beside
     it, because it is a preference rather than a thing to do. */
  select.mood {
    min-height: 30px;
    padding: 4px 8px;
    font-size: var(--text-sm);
    color: var(--text-secondary);
    border-color: transparent;
    background: transparent;
  }

  select.mood:hover { background: var(--surface-2); }

  /* Panels. Each a thing somebody can look at on its own. */
  .panel {
    background: var(--surface-2);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    /*
      **Panels stacked in a column have always touched** — decision
      0178.
      
      The grid's own `gap` spaced the two columns and nothing spaced
      panels *within* one, so the process row met the party boxes and
      the invoice header met its lines. Reported twice, as two separate
      screens, because it looks like a different problem each time.
      
      On the panel rather than on each screen: every one of them is a
      card in a stack, and a rule per screen is a rule the next screen
      forgets.
    */
    margin: 0 0 14px;
  }

  /* Nothing dangling below the last card in a column. */
  .panel:last-child { margin-bottom: 0; }

  /*
    **A grid spaces its own children** — decision 0179.

    Decision 0178 gave every panel a bottom margin, which is right for a
    stack and wrong inside a grid: `.parties` already has a `gap`, and
    its panels **stretch to the same row height**. The `:last-child`
    reset then applied to the Buyer alone, so the Seller lost 14px to a
    margin inside an equally-tall box and the two borders stopped
    lining up.

    Reported as *"why is the border under seller different from the
    border under buyer?"* — which is the sort of thing only a person
    looking at it would ask, and exactly right.
  */
  .parties > .panel { margin-bottom: 0; }

  /*
    The Seller card — decision 0221, from the operator's own mock-up.

    **Label and value on one line**, because these are short, read-only
    and being scanned against a document. The keying form stacks them
    and should: its values are inputs.
  */
  .sellergrid {
    display: grid;
    /*
      **`minmax(0, …)`, not `auto`** — decision 0223.

      `auto` sizes a column to its content and **refuses to shrink
      below it**, so a country like *United Kingdom of Great Britain and
      Northern Ireland* pushed the address straight out through the
      side of the card. A grid track's default minimum is its content,
      and `minmax(0, …)` is what says otherwise.
    */
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 4px 20px;
    align-items: start;
  }
  .sfield {
    display: grid;
    /* The value track needs the same treatment: a long email has no
       spaces to break at and would widen the row rather than wrap. */
    grid-template-columns: 88px minmax(0, 1fr);
    gap: 8px;
    align-items: baseline;
    line-height: 1.5;
    /* An address line, an email or a VAT number written without spaces
       has nowhere natural to break. */
    overflow-wrap: anywhere;
  }
  .slabel {
    color: var(--text-muted);
    /* **A label that wraps pushes its value down** and the column stops
       lining up, which is the whole reason for a fixed width. */
    white-space: nowrap;
  }

  @media (max-width: 520px) {
    /* Two columns at this width means an address of one word per line. */
    .sellergrid { grid-template-columns: 1fr; }
  }

  /*
    **An amber ribbon on a card with something to do** — decision 0222,
    the same shape as decision 0161's unreadable notice and for the same
    reason its comment gives: nothing went wrong, and there is something
    for a person to do.

    Deliberately not a red border. An unmatched supplier may be a
    genuinely new one, and leaving it is a real answer.
  */
  /*
    **A card's own action, beside its title** — decision 0228.

    Bottom right first, and the operator was right that it was wrong:
    *"it might extend the card size... There is space in the top right
    already, due to the card heading creating some empty space."*

    A footer adds height to a card in a column already short of it. The
    heading row has room doing nothing.
  */
  .cardhead {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
  }
  .cardhead > h3 { margin-bottom: 0; }
  /*
    Pulled up and out, so the button's own padding does not push the
    title's baseline down — the row should be the height of the title,
    not of the button.
  */
  .cardhead > .actionlink {
    margin: -6px -4px 0 0;
  }

  /* A supplier row opens one — decision 0230. */
  tr.clickable { cursor: pointer; }
  tr.clickable:hover { background: var(--surface-1); }

  .statebuttons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin: 10px 0;
  }

  /*
    **Label above value**, unlike the read-only party cards. These are
    inputs: a label beside a text box makes the box narrow, and the
    argument for inline labels (decision 0221) was that the values were
    short and read-only.
  */
  .editgrid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 14px;
    margin: 10px 0;
  }
  .editgrid > label {
    color: var(--text-muted);
    align-self: end;
  }
  .editgrid > input { width: 100%; }

  @media (max-width: 520px) {
    .editgrid { grid-template-columns: 1fr; }
  }

  /*
    The dashboard — decision 0242.

    **Two columns, and cards that choose their own width.** A grid of
    equal thirds would make a four-figure count as wide as a worklist,
    and the worklist is the one somebody came for.
  */
  /*
    **Four columns, and a card asks for what it needs** — decision 0244.

    The first version gave every card an equal half, so a count sat in a
    panel the width of a worklist with a void beside it. A count and a
    table are both cards and are not the same size of thing.
  */
  /*
    **A strip of figures, then the wider cards** — decision 0246.

    Mixing the two in one grid gave every row a ragged bottom: a short
    tile beside a tall chart left a void the height of the chart. **A
    figure and a chart are different heights by nature**, and a grid
    that lets them fight produces holes.

    The strip stretches, so four figures are four equal cards rather
    than four different ones.
  */
  /*
    **Flex, not grid** — decision 0246.

    `auto-fit` sizes tracks to a minimum and then collapses the empty
    ones, which is right for a gallery and wrong for a row of figures:
    three tiles took three narrow columns and left the rest of the row
    empty.

    Flex with `grow` shares the whole row between however many there
    are — three take thirds, four take quarters — and `min-width` is
    what decides when they wrap rather than a column count.
  */
  /*
    **One gap, everywhere** — decision 0246.

    The strip, the grid and a panel's own margin were 12px, 12px and
    14px, which reads as a mistake rather than a rhythm. A dashboard is
    a page of rectangles and **the eye measures the space between them
    against itself**; two values two pixels apart are the worst case,
    because it looks wrong and nobody can say why.
  */
  .dashstrip,
  .dashgrid { --dash-gap: 12px; }

  .dashstrip {
    display: flex;
    flex-wrap: wrap;
    gap: var(--dash-gap);
    align-items: stretch;
    /* The same gap below the strip as between its cards. */
    margin-bottom: var(--dash-gap);
  }
  .dashstrip > .panel {
    /*
      **Grow to share, shrink to fit, and wrap below 240px** — decision
      0257 raised this from 200px at the operator's asking that a tile
      be easier to read "across a desk." On a phone this still means one
      per row; on a desk it means three or four rather than five or six
      cramped ones.
    */
    flex: 1 1 240px;
    min-width: 240px;
    min-height: 148px;
    margin-bottom: 0;
  }
  /*
    **Roomier than the base panel** — decision 0257. The same padding as
    every other panel was right when a tile held one line of text
    (decision 0246); it is tight around a 40px figure and a background
    line. A little more air on all sides, kept even so nothing looks
    accidental.
  */
  .dashstrip > .panel {
    display: flex;
    flex-direction: column;
    padding: 20px 22px 18px;
    /* A positioning context for the background chart below. */
    position: relative;
    overflow: hidden;
  }

  /*
    **A chart behind the text, not beside it** — decision 0257.

    Absolutely positioned and given `z-index: 0` explicitly rather than
    relying on paint order: a statically positioned element is not
    guaranteed to sit below a positioned sibling just because it comes
    later in the document, and this must never end up on top of the
    number it is meant to sit behind.
  */
  .tilebg {
    position: absolute;
    inset: auto 0 0 0;
    height: 46px;
    z-index: 0;
    pointer-events: none;
  }
  .tilefg {
    position: relative;
    z-index: 1;
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .dashstrip > .panel > .cardhead > h3 {
    font-size: var(--text-sm);
    color: var(--text-muted);
    font-weight: 400;
    margin-bottom: 0;
  }

  /*
    **A card's sub-line is a caption, not a page intro** — decision
    0246.

    `.sub` carries a 34px bottom margin from the topbar it was written
    for, which put a third of an inch of nothing between *"All open
    work"* and the chart it describes. Inside a dashboard card it sits
    under its heading and gets out of the way.
  */
  .dashstrip .sub,
  .dashgrid .sub { margin: 2px 0 10px; }

  /*
    **The content fills what is left**, so two cards of a row that share
    a height do not both leave their slack at the bottom.
  */
  .dashgrid > .panel {
    display: flex;
    flex-direction: column;
    /*
      **A panel's own margin is off inside a dashboard, here too** —
      decision 0261.
      
      Decision 0246 recorded this exact fix — "twenty-six between rows"
      — but only ever wrote the override for `.dashstrip`. `.dashgrid`
      never got it: every panel inside it has carried the base panel's
      14px bottom margin on top of the grid's own 12px gap the entire
      time, undetected because nothing before had a tall enough
      neighbour to make 26px look wrong next to a correct 12px.
    */
    margin: 0;
  }
  /*
    **The donut gets the same treatment as the bar chart** — decision
    0261. `donutChart()` returns a wrapping `.donutwrap`, not a raw
    `svg`, so it never matched the rule below: a bar chart sat pinned to
    the bottom of a stretched card and a donut sat pinned to the top
    with visible empty space below it, which is what read as two cards
    of different heights even when their borders were already equal.
  */
  .dashgrid > .panel > svg,
  .dashgrid > .panel > .donutwrap {
    margin-top: auto;
  }

  /*
    The wider cards. **Equal heights within a row**, so two charts
    side by side share a baseline instead of each finding its own.
  */
  .dashgrid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: var(--dash-gap);
    /*
      **Equal heights within a row.** Two charts side by side share a
      baseline rather than each finding its own.
    */
    align-items: stretch;
  }
  /* The worklist spans, because a table in half a screen is a table nobody reads. */
  .dashgrid > .panel:has(.clocktable) { grid-column: 1 / -1; }

  @media (max-width: 820px) {
    .dashgrid { grid-template-columns: 1fr; }
  }

  .bignum {
    font-size: var(--text-figure);
    line-height: 1.1;
    /* Lining figures of one width, so 11 and 44 are the same size on
       screen and a column of counts does not shimmer. */
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    margin-top: 2px;
  }
  .bignum.warn { color: var(--text-warning); }
  /* Three small figures in the space of one, which is what makes a
     tile denser than a panel rather than emptier. */
  .figures { display: flex; gap: 18px; }
  .figures .bignum { font-size: var(--text-xl); }
  /* The scale's smallest step, rather than a size below it. */
  .tiny { font-size: var(--text-sm); }

  /*
    **A supplier name is left, a number is right** — decision 0246.

    `th` centres by default, so the first heading floated over the
    middle of a wide column while the names beneath it began at the
    left. A heading that does not sit above its column is a heading
    for something else.
  */
  .clocktable { width: 100%; margin-top: 10px; }
  .clocktable th { text-align: left; font-weight: 400; color: var(--text-muted); }
  .clocktable th.num, .clocktable .num { text-align: right; white-space: nowrap; }
  /* The names get what they need; the numbers get what they are. */
  .clocktable th:first-child { width: 50%; }
  .clocktable td { padding: 7px 0; }

  /* A sort is a choice among few, so it reads as chips rather than a menu. */
  .chips { display: flex; gap: 6px; }
  .chip {
    background: none;
    border: 0.5px solid var(--border);
    border-radius: 999px;
    padding: 3px 10px;
    font: inherit;
    font-size: var(--text-sm);
    color: var(--text-muted);
    cursor: pointer;
  }
  .chip.on { color: var(--text-primary); border-color: var(--text-accent); }

  /*
    **A drill-through says what it is showing** — decision 0259, the
    documents and suppliers screens' shared banner for a dashboard
    card's click-through. `.chip` reused for "Clear filter" rather than
    a second button style for the same action.
  */
  .alertbanner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    color: var(--text-primary);
  }

  /* The picker — decision 0243. Cards, because a list of nine names
     says nothing about what each one shows. */
  .pickgrid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin: 10px 0;
  }
  .pickcard {
    text-align: left;
    background: none;
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 9px 11px;
    font: inherit;
    color: inherit;
    cursor: pointer;
  }
  .pickcard:hover { background: var(--surface-1); }
  .pickcard.on { border-color: var(--text-accent); }
  @media (max-width: 520px) { .pickgrid { grid-template-columns: 1fr; } }

  /*
    **Hidden on the left, displayed on the right** — decision 0262, the
    operator's own picture of the picker: "two columns... center arrows
    to add (move right) or remove (move left)."
  */
  .moverpopout { width: min(680px, 100%); }
  .movergrid {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 10px;
    align-items: start;
    margin: 10px 0;
  }
  .movercollabel {
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 6px;
  }
  .movercol {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-height: 160px;
    max-height: 320px;
    overflow-y: auto;
  }
  /* A list row is a list row, not a two-up card — full width, tighter. */
  .movercol .pickcard { padding: 8px 10px; }

  .moverarrows {
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-self: center;
  }
  .moverarrow {
    width: 36px;
    height: 36px;
    border-radius: 999px;
    border: 0.5px solid var(--border-strong);
    background: var(--surface-1);
    color: var(--text-primary);
    font-size: var(--text-lg);
    cursor: pointer;
    line-height: 1;
  }
  .moverarrow:hover:not(:disabled) { border-color: var(--text-accent); }
  .moverarrow:disabled { opacity: 0.35; cursor: default; }

  @media (max-width: 560px) {
    /* Stacked, with the arrows as a horizontal pair between the lists
       rather than a column with nothing either side of it. */
    .movergrid { grid-template-columns: 1fr; }
    .moverarrows { flex-direction: row; justify-content: center; }
  }

  /* The ring beside its legend — decision 0247. */
  .donutwrap {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-top: auto;
  }
  .donutwrap > svg { flex: 0 0 auto; }
  .donutlegend { flex: 1 1 auto; min-width: 0; }
  .donutkey {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: var(--text-sm);
    padding: 2px 0;
  }
  /* The value sits right, so a column of them reads as a column. */
  .donutkey > span:nth-child(2) { flex: 1 1 auto; min-width: 0; }
  .donutdot { width: 9px; height: 9px; border-radius: 999px; flex: 0 0 auto; }

  /*
    **A legend row that leads somewhere** — decision 0264. Widened
    hit area beyond the text itself, since a row a few pixels tall is a
    small target otherwise.
  */
  .donutkey.clickable {
    cursor: pointer;
    margin: 0 -6px;
    padding: 2px 6px;
    border-radius: 6px;
  }
  .donutkey.clickable:hover { background: var(--surface-1); }

  @media (max-width: 480px) {
    .donutwrap { flex-direction: column; align-items: stretch; }
  }

  /*
    **The worklist scrolls rather than growing** — decision 0250.

    Twenty-five rows is a card taller than the screen, and everything
    beneath it becomes unreachable without scrolling past somebody
    else's work. A fixed height makes the page's shape stable whatever
    is in the queue.
  */
  .clockscroll {
    max-height: 340px;
    overflow-y: auto;
    margin-top: 10px;
  }
  .clockscroll thead th {
    position: sticky;
    top: 0;
    /* Opaque, or the rows scroll under a transparent heading. */
    background: var(--surface-2);
    z-index: 1;
  }

  /* The count and the ring side by side, in a tile. */
  .stagesplit {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  /*
    **A graphic, where a chart would otherwise sit** — decision 0259.
    Sized like the stage tile's ring beside it, muted rather than
    outlined in a warning colour even when the count is not zero: the
    figure already carries the alert, and a red icon beside a red
    number would be saying the same thing twice.
  */
  .tileicon {
    color: var(--text-muted);
    flex: 0 0 auto;
  }
  .tileicon svg { width: 44px; height: 44px; stroke-width: 1.3; }

  tr.clickable, .panel.clickable { cursor: pointer; }
  tr.clickable:hover { background: var(--surface-1); }
  .panel.clickable:hover { border-color: var(--text-accent); }

  .barlist-row { margin-bottom: 9px; }
  .barlist-head { display: flex; justify-content: space-between; font-size: var(--text-sm); gap: 10px; }
  .barlist-track { height: 6px; background: var(--border); border-radius: 3px; margin-top: 3px; }
  .barlist-fill { height: 6px; border-radius: 3px; }

  .panel.needsattention {
    border-left: 3px solid var(--text-warning);
    border-radius: 0 var(--radius) var(--radius) 0;
  }

  /* A button that reads as a link, because it opens rather than acts. */
  .linky {
    background: none;
    border: none;
    padding: 0;
    color: var(--text-accent);
    text-decoration: underline;
    cursor: pointer;
    font: inherit;
  }

  .backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 50;
  }
  .popout {
    /*
      **`--surface-2`, which exists** — decision 0223.

      This read `--bg-panel`, a variable I invented: a token nothing
      defines is not an error, it is **transparent**, so the box
      rendered over the page with every word behind it showing through.
    */
    background: var(--surface-2);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    width: min(520px, 100%);
    max-height: 80vh;
    overflow: auto;
  }
  .searchbox {
    width: 100%;
    margin: 8px 0;
  }
  .searchresults { margin-bottom: 10px; }
  .searchresult {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-bottom: 0.5px solid var(--border);
    padding: 8px 4px;
    cursor: pointer;
    font: inherit;
    color: inherit;
  }
  /* `--bg-hover` was invented too. */
  .searchresult:hover { background: var(--surface-1); }

  .panel > h3 {
    margin: 0 0 12px;
    font-size: var(--text-base);
    font-weight: 600;
    color: var(--text-secondary);
  }


  .stat .label { font-size: var(--text-sm); color: var(--text-secondary); }
  .stat .value { font-size: var(--text-xl); font-weight: 600; margin-top: 3px; }
  .stat .note { font-size: var(--text-sm); color: var(--text-muted); margin-top: 2px; }
  .stat.good .value { color: var(--text-success); }
  .stat.warn .value { color: var(--text-warning); }



  /* Seller beside buyer, collapsing on a narrow screen like everything
     else (decision 0108). */
  .parties {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 16px;
    margin-bottom: 16px;
  }

  /*
    Three columns on a wide monitor, fewer as it narrows.

    A mockup rendered at 1536px never shows what three columns do at
    1280 -- an ordinary laptop -- so the panels reflow rather than
    shrink (decision 0108).
  */
  .columns {
    display: grid;
    grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
    gap: 16px;
    align-items: start;
  }

  @media (max-width: 1100px) {
    .columns { grid-template-columns: minmax(0, 1fr); }
    .frame { grid-template-columns: 1fr; }
    .nav { display: flex; gap: 6px; border-right: none; border-bottom: 0.5px solid var(--border); padding: 10px; }
    .nav .mark, .nav .who { display: none; }
  }

  #shell { width: auto; padding: 0; }

  #shell header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 26px;
  }

  #shell header .mark {
    width: 34px;
    height: 3px;
    margin: 0;
    flex: none;
  }

  #shell h1 { font-size: var(--text-xl); margin: 0; }
  #shell .sub { margin: 2px 0 0; font-size: var(--text-base); }
  #shell .signout { margin-left: auto; min-height: 30px; padding: 0 12px; }

  .filters { display: flex; gap: 10px; margin-bottom: 14px; }
  .filters select { width: auto; min-width: 150px; }

  .counts {
    margin: 0 0 12px;
    font-size: var(--text-base);
    color: var(--text-secondary);
  }

  #shell table { width: 100%; font-size: var(--text-base); }

  #shell th {
    text-align: left;
    font-weight: 500;
    font-size: var(--text-sm);
    color: var(--text-secondary);
    padding: 0 10px 8px;
    border-bottom: 0.5px solid var(--border);
  }

  #shell td {
    padding: 10px;
    border-bottom: 0.5px solid var(--border);
    vertical-align: middle;
  }

  /* Numbers align right and share a width, so amounts compare by eye. */
  #shell .num { text-align: right; font-variant-numeric: tabular-nums; }

  /* Mine leads. A row somebody else holds recedes without disappearing. */
  #shell tr.mine td:first-child { box-shadow: inset 2px 0 0 var(--brand-fill); }
  #shell tr.locked { color: var(--text-secondary); }

  .muted { color: var(--text-muted); }

  button.act {
    min-height: 26px;
    padding: 0 10px;
    margin-right: 6px;
    font-size: var(--text-sm);
  }

  button.act:disabled { opacity: 0.4; cursor: default; }

  /* The Validation viewer — decision 0106. */
  #viewer { width: auto; padding: 0; }

  /* The line table — decision 0109. */
  .linetable { width: 100%; table-layout: fixed; margin-bottom: 10px; }
  .linetable th { padding: 0 6px 6px; }
  .linetable td { padding: 3px 6px; border: none; }
  .linetable input { min-height: 30px; font-size: var(--text-base); }

  /*
    A read-only field is text, not a disabled input (decision 0114). A
    greyed-out box invites clicking and reads as broken; plain text says
    the value is information rather than something to change.
  */
  .readonly {
    min-height: 32px;
    padding: 8px 0;
    font-size: var(--text-base);
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
  }

  .linetable .readonly { padding: 3px 6px; min-height: 30px; }
  .linetable th:first-child, .linetable td:first-child { width: 30px; }
  .linetable th:last-child, .linetable td:last-child { width: 34px; }
  /* BT-130 is a three-character UN/ECE code, so its column is narrow. */
  .linetable td.short { width: 70px; }
  .linetable th:nth-child(4) { width: 70px; }

  button.rm {
    min-height: 28px;
    width: 28px;
    padding: 0;
    color: var(--text-muted);
    border-color: transparent;
  }

  .linefoot { display: flex; align-items: center; gap: 12px; }

  /*
    Advisory, never blocking (decision 0109). An invoice whose lines do
    not sum to its printed total is a fact to record faithfully, not an
    input to prevent — so this states what it found and nothing stops
    saving.
  */
  .linetotal {
    margin-left: auto;
    font-size: var(--text-base);
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
  }

  .linetotal.off { color: var(--text-warning); }

  /*
    The validation panel — decision 0119.

    **Fixed height and scrolling.** A document with fourteen exceptions
    must not push the fields it is complaining about off the screen: the
    panel is a companion to the form, not a thing that displaces it.
  */
  .exceptions .exlist {
    max-height: 190px;
    overflow-y: auto;
    margin: -4px -6px;
    padding: 4px 6px;
  }

  .exrow {
    padding: 8px 0;
    border-bottom: 0.5px solid var(--border);
    font-size: var(--text-base);
  }

  .exrow:last-child { border-bottom: none; }
  .extext { color: var(--text-warning); }
  .exwhere { color: var(--text-muted); font-size: var(--text-sm); margin-top: 2px; }
  .exrow.muted .extext { color: var(--text-muted); }

  /*
    A failing field carries its reason as a tooltip, so somebody does
    not have to hunt through the panel to find which of fourteen
    exceptions is theirs.
  */
  .kf.failing input,
  .kf.failing select,
  .kf.failing .readonly,
  .linetable td.failing input {
    border-color: var(--border-warning);
    background: var(--bg-warning);
  }

  .kf.failing label { color: var(--text-warning); }

  /*
    The document itself, in the panel — decision 0123.

    Fixed height so the panel does not grow with the document; the
    browser's own viewer scrolls and zooms inside it.
  */
  .vpreview {
    height: 320px;
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--surface-1);
  }

  .vframe, .vimage { width: 100%; height: 100%; border: none; display: block; }
  .vimage { object-fit: contain; background: var(--surface-0); }

  /*
    The actions, below the document — decision 0122.

    A horizontal row rather than a stack of full-width buttons: they
    belong to the document above them, and eight stacked buttons read as
    a menu rather than as things to do with what is on screen.
  */
  .actionrow {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 12px;
  }

  .actionlink {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    min-width: 62px;
    padding: 9px 6px;
    min-height: 0;
    border-color: transparent;
    background: transparent;
    color: var(--text-secondary);
    font-size: var(--text-sm);
    line-height: 1.2;
    text-align: center;
  }

  .actionlink svg { width: 20px; height: 20px; }
  .actionlink:hover:not(:disabled) { background: var(--surface-2); color: var(--text-primary); }

  /*
    One dominant action, still (decision 0108). Giving every action the
    same weight would lose which one a person is here to press.
  */
  .actionlink.primary { color: var(--text-primary); }
  .actionlink.primary svg { stroke-width: 2; }

  .actionlink:disabled { opacity: 0.4; }

  /* One action per line, in one place — decision 0108. */
  .actions button { display: block; }
  button.wide { width: 100%; margin: 0 0 8px; min-height: 32px; }
  .actions button.primary { margin-bottom: 12px; }

  .vhead {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding-bottom: 16px;
    border-bottom: 0.5px solid var(--border);
  }

  .vtitle { margin: 0; font-size: var(--text-lg); font-weight: 600; }
  .vhead .sub { margin: 2px 0 0; }
  .vhead .close { margin-left: auto; min-height: 30px; padding: 0 12px; }

  /* Document beside fields, so a person reads and types without
     switching windows — the whole point of the screen. */
  .vbody {
    display: grid;
    grid-template-columns: 190px minmax(0, 1fr);
    gap: 20px;
    padding: 22px 0;
  }

  .vthumb {
    height: 150px;
    display: grid;
    place-items: center;
    background: var(--surface-1);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    color: var(--text-muted);
    font-size: var(--text-base);
    margin-bottom: 8px;
  }

  .vdoc .act { width: 100%; }

  .vfields {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    align-content: start;
  }

  .kf label {
    display: block;
    font-size: var(--text-sm);
    color: var(--text-secondary);
    margin-bottom: 4px;
  }

  .vfoot {
    display: flex;
    align-items: center;
    gap: 16px;
    padding-top: 16px;
    border-top: 0.5px solid var(--border);
  }

  .vfoot .problem { margin: 0; flex: 1; }

  .vfoot .primary {
    background: var(--brand-fill);
    color: #fff;
    border: none;
    min-height: 34px;
    padding: 0 16px;
    font-weight: 500;
  }
  .since p { margin: 0 0 6px; }
  .since ul { margin: 0; padding-left: 16px; }
  .since li { color: var(--text-warning); }
</style>
</head>

<body>
<!--
  Hidden until the page knows which screen it wants — decision 0103.

  Visible-by-default meant the sign-in form painted on every refresh and
  then vanished when /api/whoami answered, which looks like a session
  failing and recovering. Starting with neither shown means nothing
  flashes: the page genuinely does not know yet, and says so by showing
  nothing rather than by showing the wrong thing.
-->
<main id="signin-view" hidden>
  <div class="mark"></div>
  <!--
    Empty, and filled from the strings and the customer's livery.
    A default in the markup would flash the wrong name and the wrong
    language before either arrives.
  -->
  <h1 id="product"></h1>
  <p class="sub" data-t="signin.title"></p>

  <form id="signin" autocomplete="on">
    <div class="field">
      <label for="email" data-t="signin.email"></label>
      <input id="email" name="email" type="email" required autocomplete="username">
    </div>

    <div class="field">
      <label for="password" data-t="signin.password"></label>
      <input id="password" name="password" type="password" required autocomplete="current-password">
    </div>

    <div class="field">
      <label for="environment" data-t="signin.environment"></label>
      <select id="environment" name="environment" required disabled>
        <option value="" data-t="signin.choose"></option>
      </select>
    </div>

    <button type="submit" id="submit" data-t="signin.continue"></button>
  </form>

  <div class="problem" id="problem" role="alert"></div>
  <div class="since" id="since"></div>
</main>

<!--
  Where the Task Manager renders. Empty until the page knows somebody is
  signed in — decision 0103.
-->
<main id="shell" hidden></main>

<!-- The Validation viewer, shown in place of the list — decision 0106. -->
<main id="viewer" hidden></main>

<script type="module" src="/boot.js"></script>
</body>
</html>
