<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>

<!--
  Structural tokens first, then the customer's livery over the top.

  Both are stylesheets rather than JavaScript so they apply before the
  first paint. Fetching branding as JSON and setting variables in script
  would mean a visible flash of the wrong colours (decision 0096).
-->
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" id="brand" href="">
<script src="/config.js"></script>

<style>
  /*
    Restraint in service of legibility, not impression — decision 0101.
    This is a tool somebody uses all day, so the quiet has to make the
    work easier to read rather than make the page look expensive.

    Three things carry it, and no new assets:

      1. Vertical rhythm that GROUPS. A label sits close to its field
         and far from the next one, so the eye reads three pairs rather
         than one list of six things.
      2. One element leading. The heading is larger and the rest steps
         down from it, where before everything had equal weight.
      3. No card. A frame makes the form an object floating on a
         surface; letting it sit in space is more confident, and only
         works once the composition holds it together.
  */

  :root {
    /* An explicit scale, because tokens.css has none. Each step is a
       ratio rather than an arbitrary number, so the relationships hold
       if any one changes. */
    --step-0: 14px;
    --step-1: 15px;
    --step-2: 26px;

    /* Rhythm. The tight value binds a label to its field; the loose
       one separates one pair from the next. Their RATIO is what does
       the grouping — roughly one to four. */
    --gap-tight: 7px;
    --gap-loose: 26px;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    /* A single wash of the brand behind the page. Not a background
       image: an external image would make a customer's login page
       depend on a third party, which is an availability question on
       the authentication path and a data-protection one in a finance
       product. This is one gradient and no requests. */
    background:
      radial-gradient(120% 90% at 50% -10%, color-mix(in oklab, var(--brand-fill) 11%, transparent), transparent 65%),
      var(--surface-0);
    font: var(--step-0)/1.5 var(--font-sans);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }

  main {
    width: min(360px, calc(100vw - 40px));
    /* No card, no border, no panel. */
    padding: 0 0 40px;
  }

  /*
    The brand mark: a short rule rather than a full-width bar. A bar
    spanning the form reads as a container's edge; a mark reads as
    identity, and stays out of the way of the work.
  */
  .mark {
    width: 34px;
    height: 3px;
    background: var(--brand-fill);
    border-radius: 2px;
    margin-bottom: 22px;
  }

  h1 {
    font-size: var(--step-2);
    font-weight: 600;
    letter-spacing: -0.021em; /* Large text sets loose; pulled back in. */
    margin: 0 0 6px;
  }

  .sub {
    color: var(--text-secondary);
    margin: 0 0 34px;
  }

  /* The grouping, stated once rather than per field. */
  .field + .field { margin-top: var(--gap-loose); }

  label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: var(--gap-tight);
  }

  input, select {
    width: 100%;
    font-size: var(--step-1);
    min-height: 38px;
    background: var(--surface-1);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 11px;
    color: var(--text-primary);
    /* Only the border moves on focus. A shifting shadow or size makes
       a form feel unsteady under the hands. */
    transition: border-color 120ms ease;
  }

  input:focus, select:focus {
    outline: none;
    border-color: var(--brand-fill);
  }

  select:disabled { color: var(--text-muted); }

  button[type="submit"] {
    width: 100%;
    margin-top: 34px;
    min-height: 40px;
    font-size: var(--step-1);
    font-weight: 500;
    background: var(--brand-fill);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    transition: opacity 120ms ease;
  }

  button[type="submit"]:hover:not(:disabled) { opacity: 0.9; }
  button[type="submit"]:disabled { opacity: 0.4; cursor: default; }

  /*
    Messages sit below the form and are quiet by default. A red panel
    for a mistyped password treats an ordinary event as an emergency;
    the text carries it.
  */
  .problem, .since {
    margin-top: 22px;
    font-size: 13px;
    line-height: 1.55;
  }

  .problem {
    color: var(--text-warning);
  }

  .problem:empty, .since:empty { display: none; }

  .since { color: var(--text-secondary); }

  /*
    The Task Manager. A denser layout than the sign-in card on purpose:
    this is a screen somebody reads all day, so the restraint has to
    serve legibility rather than air (decision 0101).
  */
  #shell {
    width: min(1040px, calc(100vw - 40px));
    padding: 32px 0 64px;
  }

  #shell header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 26px;
  }

  #shell header .mark {
    width: 34px;
    height: 3px;
    margin: 0;
    flex: none;
  }

  #shell h1 { font-size: 18px; margin: 0; }
  #shell .sub { margin: 2px 0 0; font-size: 13px; }
  #shell .signout { margin-left: auto; min-height: 30px; padding: 0 12px; }

  .filters { display: flex; gap: 10px; margin-bottom: 14px; }
  .filters select { width: auto; min-width: 150px; }

  .counts {
    margin: 0 0 12px;
    font-size: 13px;
    color: var(--text-secondary);
  }

  #shell table { width: 100%; font-size: 13px; }

  #shell th {
    text-align: left;
    font-weight: 500;
    font-size: 12px;
    color: var(--text-secondary);
    padding: 0 10px 8px;
    border-bottom: 0.5px solid var(--border);
  }

  #shell td {
    padding: 10px;
    border-bottom: 0.5px solid var(--border);
    vertical-align: middle;
  }

  /* Numbers align right and share a width, so amounts compare by eye. */
  #shell .num { text-align: right; font-variant-numeric: tabular-nums; }

  /* Mine leads. A row somebody else holds recedes without disappearing. */
  #shell tr.mine td:first-child { box-shadow: inset 2px 0 0 var(--brand-fill); }
  #shell tr.locked { color: var(--text-secondary); }

  .muted { color: var(--text-muted); }

  button.act {
    min-height: 26px;
    padding: 0 10px;
    margin-right: 6px;
    font-size: 12px;
  }

  button.act:disabled { opacity: 0.4; cursor: default; }
  .since p { margin: 0 0 6px; }
  .since ul { margin: 0; padding-left: 16px; }
  .since li { color: var(--text-warning); }
</style>
</head>

<body>
<!--
  Hidden until the page knows which screen it wants — decision 0103.

  Visible-by-default meant the sign-in form painted on every refresh and
  then vanished when /api/whoami answered, which looks like a session
  failing and recovering. Starting with neither shown means nothing
  flashes: the page genuinely does not know yet, and says so by showing
  nothing rather than by showing the wrong thing.
-->
<main id="signin-view" hidden>
  <div class="mark"></div>
  <h1 id="product">VibeFinance</h1>
  <p class="sub">Sign in to continue</p>

  <form id="signin" autocomplete="on">
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="username">
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required autocomplete="current-password">
    </div>

    <div class="field">
      <label for="environment">Environment</label>
      <select id="environment" name="environment" required disabled>
        <option value="">Sign in to choose</option>
      </select>
    </div>

    <button type="submit" id="submit">Continue</button>
  </form>

  <div class="problem" id="problem" role="alert"></div>
  <div class="since" id="since"></div>
</main>

<!--
  Where the Task Manager renders. Empty until the page knows somebody is
  signed in — decision 0103.
-->
<main id="shell" hidden></main>

<script type="module" src="/boot.js"></script>
</body>
</html>
