<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>VibeFinance supplier network</title>
<!--
  The supplier network — decisions 0717 and 0725. The application's own
  stylesheet and frame (side menu, top bar), so the two look and feel the
  same; portal.css adds only what the network has and the app does not.
-->
<script src="/mood.js"></script>
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/portal.css">
</head>
<body>
<main id="signin-view" hidden>
  <div class="mark"></div>
  <h1 data-t="network.title"></h1>
  <p class="sub" data-t="network.subtitle"></p>
  <form id="signin-form" autocomplete="on">
    <div class="field">
      <label for="email" data-t="network.email"></label>
      <input id="email" type="email" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="password" data-t="network.password"></label>
      <input id="password" type="password" autocomplete="current-password" required>
    </div>
    <button type="submit" data-t="network.signin"></button>
  </form>
  <div class="problem" id="signin-problem" role="alert"></div>
</main>
<main id="shell" hidden></main>
<script type="module" src="/portal.js"></script>
</body>
</html>
